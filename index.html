<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat</title>
    <style>
        :root {
            --accent: #6c5ce7;
            --accent-dark: #5a4bd1;
            --user-bubble: linear-gradient(135deg, #6c5ce7, #8e7cf3);
            --bot-bubble: #ffffff;
            --bg: #eef1f8;
            --text: #1e2235;
            --muted: #8a90a6;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(1200px 600px at 80% -10%, #dfe4ff 0%, var(--bg) 55%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text);
        }
        #chat-container {
            width: 460px;
            max-width: 100%;
            height: 85vh;
            background: var(--bg);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(60, 60, 120, 0.18);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.6);
        }
        /* ---------- Header ---------- */
        #chat-header {
            background: var(--user-bubble);
            color: white;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .bot-avatar {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .header-text h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
        .status {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.78rem; opacity: 0.9;
        }
        .status .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
        }
        /* ---------- Messages ---------- */
        #chat-box {
            flex-grow: 1;
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-thumb { background: #c9cdea; border-radius: 3px; }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            animation: pop-in 0.25s ease;
        }
        .message-row.user { flex-direction: row-reverse; }
        @keyframes pop-in {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .msg-avatar {
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .user .msg-avatar { background: var(--accent); color: white; }
        .bot  .msg-avatar { background: #dfe3f5; }

        .message {
            max-width: 78%;
            padding: 11px 15px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.94rem;
        }
        .user-message {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.35);
        }
        .bot-message {
            background: var(--bot-bubble);
            border: 1px solid #e6e9f5;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(80, 80, 140, 0.08);
        }
        /* ---------- Typing indicator ---------- */
        .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
        .typing span {
            width: 7px; height: 7px; border-radius: 50%;
            background: #a7aecf;
            animation: bounce 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.15s; }
        .typing span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
        /* ---------- Code blocks ---------- */
        .bot-message pre {
            position: relative;
            background: #1e2235;
            color: #e6e9ff;
            padding: 14px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 10px 0 4px;
            font-size: 0.85rem;
        }
        .bot-message code { font-family: 'JetBrains Mono', 'Courier New', monospace; }
        .bot-message :not(pre) > code {
            background: #eceffd;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.88em;
            color: var(--accent-dark);
        }
        .copy-btn {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(255,255,255,0.12);
            color: #cfd4ff;
            border: none;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.25); }
        .bot-message p { margin: 0 0 6px; }
        .bot-message p:last-child { margin-bottom: 0; }
        .bot-message ul, .bot-message ol { margin: 4px 0; padding-left: 20px; }
        /* ---------- Input ---------- */
        #input-container {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 12px 14px;
            background: #ffffff;
            border-top: 1px solid #e8ebf7;
        }
        #user-input {
            flex-grow: 1;
            padding: 12px 16px;
            border: 1.5px solid #dfe3f5;
            border-radius: 16px;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 0.94rem;
            line-height: 1.4;
            max-height: 120px;
            transition: border-color 0.15s;
            background: #f7f8fd;
        }
        #user-input:focus { border-color: var(--accent); background: #fff; }
        #send-btn {
            background: var(--user-bubble);
            color: white;
            border: none;
            width: 46px; height: 46px;
            border-radius: 14px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s, box-shadow 0.15s;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.35);
            flex-shrink: 0;
        }
        #send-btn:hover { background: var(--accent-dark); }
        #send-btn:active { transform: scale(0.93); }
        #send-btn svg { width: 20px; height: 20px; }

        @media (max-width: 480px) {
            body { padding: 0; }
            #chat-container { width: 100%; height: 100vh; border-radius: 0; }
        }
    </style>
<base target="_blank">
</head>
<body>

    <div id="chat-container">
        <div id="chat-header">
            <div class="bot-avatar">🤖</div>
            <div class="header-text">
                <h1>Gemini Chat</h1>
                <div class="status"><span class="dot"></span> Online</div>
            </div>
        </div>
        <div id="chat-box">
            <div class="message-row bot">
                <div class="msg-avatar">🤖</div>
                <div class="message bot-message">Hello! 👋 I'm ready to chat. What's on your mind?</div>
            </div>
        </div>
        <div id="input-container">
            <textarea id="user-input" placeholder="Type a message..." rows="1"></textarea>
            <button id="send-btn" title="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script type="module">
        import { marked } from "https://esm.run/marked";
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // 1. Initialize the API
        const API_KEY = "AQ.Ab8RN6KKmBMTkEB3vDMbXywOCrgW27l6IT7e_OkKP6q4-Na2zQ"; // <-- PUT YOUR REAL API KEY HERE (starts with AIza)
        const genAI = new GoogleGenerativeAI(API_KEY);

        // 2. Set up the model and chat session
        const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });
        let chat = model.startChat({ history: [] });

        // 3. Grab HTML elements
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // 4. Helper: add a message (markdown for bot, plain text for user)
        function appendMessage(text, sender) {
            const row = document.createElement('div');
            row.classList.add('message-row', sender);

            const avatar = document.createElement('div');
            avatar.classList.add('msg-avatar');
            avatar.textContent = sender === 'user' ? '👤' : '🤖';

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender + '-message');

            if (sender === 'bot') {
                msgDiv.innerHTML = marked.parse(text);
                addCopyButtons(msgDiv);
            } else {
                msgDiv.textContent = text;
            }

            row.appendChild(avatar);
            row.appendChild(msgDiv);
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        // Add a "Copy" button on every code block
        function addCopyButtons(container) {
            container.querySelectorAll('pre').forEach(pre => {
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                btn.addEventListener('click', () => {
                    navigator.clipboard.writeText(pre.querySelector('code')?.innerText || pre.innerText);
                    btn.textContent = 'Copied ✓';
                    setTimeout(() => btn.textContent = 'Copy', 1500);
                });
                pre.appendChild(btn);
            });
        }

        // Typing indicator (animated dots)
        function showTyping() {
            const row = document.createElement('div');
            row.classList.add('message-row', 'bot');
            row.innerHTML = `
                <div class="msg-avatar">🤖</div>
                <div class="message bot-message"><div class="typing">
                    <span></span><span></span><span></span>
                </div></div>`;
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
            return row;
        }

        // 5. Send message
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            autoResize(); // reset textarea height

            const typing = showTyping();

            try {
                const result = await chat.sendMessage(text);
                const response = await result.response;
                chatBox.removeChild(typing);
                appendMessage(response.text(), 'bot');
            } catch (error) {
                chatBox.removeChild(typing);
                appendMessage("Error: Could not get a response. Check API key and console.", 'bot');
                console.error(error);
            }
        }

        // Auto-growing textarea
        function autoResize() {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('input', autoResize);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
